name: Go Deploy

on:
  workflow_dispatch:
    inputs:
      seaottermsdb_ref:
        description: 'seaotterms-db 依賴使用的版本 ref'
        required: false
        type: string
        default: 'main'

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      VPS_IP: ${{ secrets.VPS_IP }}
      VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_DEPLOY_BASE: ${{ secrets.VPS_DEPLOY_BASE }}
    steps:
      - name: Check Secrets
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_IP VPS_USERNAME VPS_SSH_KEY VPS_DEPLOY_BASE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少必要的 Secret：$name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

  build:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      BINARY_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: main

      - name: Checkout seaotterms-db
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/seaotterms-db
          ref: ${{ inputs.seaottermsdb_ref }}
          path: seaotterms-db

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: main/go.sum

      - name: Build Linux binary
        working-directory: main
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go build -ldflags="-s -w" -trimpath -o "$BINARY_NAME" .

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: main/${{ env.BINARY_NAME }}
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      REPO_NAME: ${{ github.event.repository.name }}
      BINARY_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: dist

      - name: Ensure remote deploy directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p "${{ secrets.VPS_DEPLOY_BASE }}/${{ env.REPO_NAME }}"

      - name: Upload to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: "${{ secrets.VPS_DEPLOY_BASE }}/${{ env.REPO_NAME }}/"
          strip_components: 1
          overwrite: true

      - name: Set executable permissions
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            chmod u+x "${{ secrets.VPS_DEPLOY_BASE }}/${{ env.REPO_NAME }}/${{ env.BINARY_NAME }}"
            echo "已設定執行權限：${{ env.BINARY_NAME }}"

      - name: Show deployment info
        run: |
          echo "部署 ref：${{ github.ref }} (${{ github.sha }})"
          echo "已部署至 ${{ secrets.VPS_DEPLOY_BASE }}/${{ env.REPO_NAME }}/"
